name: Update SawyerTRON

on:
  schedule:
    # Several staggered attempts make the update resilient to a scheduled event
    # being delayed or dropped by GitHub. After one succeeds, the later attempts
    # see today's timestamp and exit without changing anything.
    - cron: "17 6 * * *"
      timezone: "America/Los_Angeles"
    - cron: "37 6 * * *"
      timezone: "America/Los_Angeles"
    - cron: "57 6 * * *"
      timezone: "America/Los_Angeles"
    - cron: "17 7 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Days to fetch (30 is the normal initial backfill)"
        required: true
        default: "30"

permissions:
  contents: write

concurrency:
  group: sawyertron-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check whether today's update already succeeded
        id: update_gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt
          import json
          from pathlib import Path
          from zoneinfo import ZoneInfo

          index = json.loads(Path("assets/sawyertron/data/index.json").read_text())
          generated = dt.datetime.fromisoformat(index["generated_at"])
          pacific = ZoneInfo("America/Los_Angeles")
          already_updated = generated.astimezone(pacific).date() == dt.datetime.now(pacific).date()
          print(f"run={'false' if already_updated else 'true'}")
          PY
          fi

      - uses: actions/setup-python@v6
        if: steps.update_gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sawyertron/requirements.txt

      - name: Install dependencies
        if: steps.update_gate.outputs.run == 'true'
        run: pip install -r sawyertron/requirements.txt

      - name: Test ranking pipeline
        if: steps.update_gate.outputs.run == 'true'
        run: python -m unittest discover -s sawyertron -p 'test_*.py'

      - name: Update metadata
        if: steps.update_gate.outputs.run == 'true'
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python sawyertron/update.py --days "$BACKFILL_DAYS"
          else
            python sawyertron/update.py
          fi

      - name: Commit updated digest
        if: steps.update_gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sawyertron/data
          if git diff --cached --quiet; then
            echo "No SawyerTRON changes."
          else
            git commit -m "Update SawyerTRON digest"
            git push
          fi
